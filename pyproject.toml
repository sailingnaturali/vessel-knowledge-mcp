[project]
name = "vessel-knowledge-mcp"
version = "0.1.0"
description = "MCP server turning equipment manuals into SignalK alarm zones and equipment lookups"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bryan Clark", email = "clarkbw@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.27.1",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
ingest = ["anthropic>=0.40.0"]

[project.scripts]
vessel-knowledge-mcp = "vessel_knowledge_mcp.server:main"
vessel-knowledge = "vessel_knowledge_mcp.ingest.cli:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
